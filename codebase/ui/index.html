<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trợ lý #hỏi-đáp</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel-2:#1e222b; --line:#2a2f3a;
    --fg:#e6e9ef; --muted:#98a1b3; --accent:#5b8cff;
    --ok:#3fb950; --warn:#d29922; --bad:#f85149; --info:#58a6ff;
    --radius:12px;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f6f7f9; --panel:#ffffff; --panel-2:#f0f2f5; --line:#dfe3e8;
      --fg:#1b1f26; --muted:#5b6472; --accent:#2f6bff;
      --ok:#1a7f37; --warn:#9a6700; --bad:#cf222e; --info:#0969da;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex;flex-direction:column;height:100vh;overflow:hidden}

  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:16px;margin:0;font-weight:650}
  header .sub{color:var(--muted);font-size:12.5px}
  .spacer{flex:1}
  .pill{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--muted);white-space:nowrap}
  .pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
  .pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}

  #chat{flex:1;overflow-y:auto;padding:20px 18px 8px;display:flex;flex-direction:column;gap:16px}
  .wrap{max-width:840px;width:100%;margin:0 auto}

  .msg-user{align-self:flex-end;max-width:min(680px,88%);background:var(--accent);color:#fff;
    padding:10px 14px;border-radius:var(--radius) var(--radius) 4px var(--radius);white-space:pre-wrap;
    word-break:break-word}
  .msg-user .t{font-weight:650;margin-bottom:2px}

  .card{max-width:min(760px,94%);background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px 16px}
  .card.err{border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}

  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .badge{font-size:11.5px;font-weight:700;letter-spacing:.02em;padding:3px 9px;border-radius:6px;
    text-transform:uppercase}
  .b-answer{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
  .b-create{background:color-mix(in srgb,var(--info) 18%,transparent);color:var(--info)}
  .b-clarify{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
  .b-refuse{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
  .conf{font-size:12px;color:var(--muted)}

  .answer{font-size:15.5px;margin:0 0 12px}
  h4{margin:14px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

  .src{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:7px;background:var(--panel-2)}
  .src a{color:var(--accent);text-decoration:none;font-weight:600}
  .src a:hover{text-decoration:underline}
  .src .why{color:var(--muted);font-size:13.5px;margin-top:4px}
  .res{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;margin-left:6px;text-transform:uppercase}
  .r-resolved{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
  .r-in_progress{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
  .r-unclear{background:color-mix(in srgb,var(--muted) 20%,transparent);color:var(--muted)}

  .draft{border:1px dashed var(--line);border-radius:9px;padding:11px 13px;background:var(--panel-2)}
  .draft .dt{font-weight:650;margin-bottom:6px}
  .draft .db{white-space:pre-wrap;font-size:14px;color:var(--fg)}

  .tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;
    border:1px solid var(--line);background:var(--panel-2);margin-right:6px}

  .next{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);
    color:var(--muted);font-size:13.5px}
  .warns{margin-top:10px;font-size:13px;color:var(--warn);
    background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:8px;padding:8px 11px}
  .warns ul{margin:4px 0 0;padding-left:18px}

  details.trace{margin-top:12px}
  details.trace summary{cursor:pointer;font-size:12.5px;color:var(--muted);user-select:none}
  details.trace pre{margin:8px 0 0;background:var(--panel-2);border:1px solid var(--line);
    border-radius:8px;padding:10px;font-size:12px;overflow-x:auto;max-height:340px}

  footer{border-top:1px solid var(--line);background:var(--panel);padding:12px 18px 14px}
  .examples{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
  .ex{font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--muted);cursor:pointer}
  .ex:hover{color:var(--fg);border-color:var(--accent)}
  .inputs{display:flex;flex-direction:column;gap:8px}
  input[type=text],textarea{width:100%;background:var(--panel-2);color:var(--fg);
    border:1px solid var(--line);border-radius:9px;padding:10px 12px;font:inherit;resize:none}
  input[type=text]:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .send-row{display:flex;gap:10px;align-items:flex-end}
  .send-row textarea{flex:1;min-height:46px;max-height:180px}
  button.send{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:12px 20px;
    font:inherit;font-weight:650;cursor:pointer;white-space:nowrap}
  button.send:disabled{opacity:.5;cursor:not-allowed}
  .hint{color:var(--muted);font-size:11.5px;margin-top:6px}

  .dots span{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;
    background:var(--muted);animation:b 1.2s infinite}
  .dots span:nth-child(2){animation-delay:.2s}
  .dots span:nth-child(3){animation-delay:.4s}
  @keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
</style>
</head>
<body>

<header>
  <h1>Trợ lý #hỏi-đáp</h1>
  <span class="sub">AI Thực Chiến · prototype mức Mock (23 post giả)</span>
  <span class="spacer"></span>
  <span class="pill" id="model">…</span>
  <span class="pill" id="key">…</span>
</header>

<div id="chat">
  <div class="wrap" style="color:var(--muted);font-size:13.5px">
    Gõ câu hỏi như đang soạn post mới trong <b>#hỏi-đáp</b>. Trợ lý sẽ tìm post cũ, đọc thread,
    rồi quyết định: trả lời từ post cũ · soạn post mới · hỏi lại · hoặc từ chối.
  </div>
</div>

<footer>
  <div class="wrap">
    <div class="examples" id="examples"></div>
    <div class="inputs">
      <input type="text" id="title" placeholder="Tiêu đề nháp (không bắt buộc)">
      <div class="send-row">
        <textarea id="body" rows="1" placeholder="Nội dung câu hỏi…  (Enter để gửi · Shift+Enter xuống dòng)"></textarea>
        <button class="send" id="send">Gửi</button>
      </div>
      <div class="hint" id="hint"></div>
    </div>
  </div>
</footer>

<script>
const chat = document.getElementById('chat');
const titleEl = document.getElementById('title');
const bodyEl = document.getElementById('body');
const sendBtn = document.getElementById('send');
const hintEl = document.getElementById('hint');

const EXAMPLES = [
  ['Lỗi 401 khi gọi API', 'Em gọi API thì trả về 401 Unauthorized, chạy mãi không được.'],
  ['Model không gọi tool', 'Em định nghĩa tool rồi mà model cứ trả lời thẳng, không chịu gọi tool.'],
  ['Nộp reflection ở đâu', 'Cho em hỏi bài reflection cá nhân thì nộp ở đâu ạ?'],
  ['Deploy Cloudflare Workers', 'Em muốn deploy backend lên Cloudflare Workers thì làm sao?'],
  ['', 'code em lỗi, giúp em với'],
  ['', 'Giải hộ em bài tập lab day 2 với, em không kịp làm.'],
];

const DECISION = {
  answer_from_post: ['Trả lời từ post cũ', 'b-answer'],
  create_new_post:  ['Nên tạo post mới',  'b-create'],
  ask_clarify:      ['Hỏi lại',           'b-clarify'],
  refuse_out_of_scope: ['Ngoài phạm vi',  'b-refuse'],
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function scroll(){ chat.scrollTop = chat.scrollHeight; }

function add(html, cls){
  const el = document.createElement('div');
  el.className = cls;
  el.innerHTML = html;
  chat.appendChild(el);
  scroll();
  return el;
}

function renderCard(data){
  const out = data.output || {};
  const [label, cls] = DECISION[out.decision] || ['Không rõ', 'b-clarify'];
  let h = `<div class="row"><span class="badge ${cls}">${esc(label)}</span>
           <span class="conf">độ tin cậy: <b>${esc(out.confidence)}</b></span></div>`;

  if (out.answer) h += `<p class="answer">${esc(out.answer)}</p>`;
  if (out.clarify_question) h += `<p class="answer">❓ ${esc(out.clarify_question)}</p>`;

  if ((out.sources || []).length){
    h += `<h4>Nguồn (${out.sources.length})</h4>`;
    for (const s of out.sources){
      h += `<div class="src">
        <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.post_id)} · ${esc(s.title)}</a>
        <span class="res r-${esc(s.resolution)}">${esc(s.resolution)}</span>
        ${s.why ? `<div class="why">${esc(s.why)}</div>` : ''}
      </div>`;
    }
  }

  if (out.draft_post){
    h += `<h4>Post nháp gợi ý</h4>
      <div class="draft">
        <div class="dt">${esc(out.draft_post.title)}</div>
        <div class="db">${esc(out.draft_post.body)}</div>
      </div>`;
  }

  if ((out.suggested_tags || []).length){
    h += `<h4>Tag gợi ý</h4>` +
         out.suggested_tags.map(t => `<span class="tag">${esc(t)}</span>`).join('');
  }

  if (out.next_step) h += `<div class="next">→ ${esc(out.next_step)}</div>`;

  if ((out.warnings || []).length){
    h += `<div class="warns"><b>Cảnh báo hợp đồng output (${out.warnings.length})</b><ul>` +
         out.warnings.map(w => `<li>${esc(w)}</li>`).join('') + `</ul></div>`;
  }

  const tr = data.trace || {};
  const calls = (tr.tool_calls || []).map(c =>
    `${c.name}(${esc(JSON.stringify(c.args))})`).join('  ·  ') || 'không gọi tool nào';
  h += `<details class="trace">
      <summary>Trace · ${esc(tr.model)} · ${tr.latency_ms} ms · ${(tr.tool_calls||[]).length} tool call${tr.repair_used ? ' · đã phải sửa JSON' : ''}</summary>
      <div style="font-size:12.5px;color:var(--muted);margin-top:8px">${calls}</div>
      <pre>${esc(JSON.stringify(tr, null, 2))}</pre>
    </details>`;

  return h;
}

async function send(){
  const title = titleEl.value.trim();
  const body = bodyEl.value.trim();
  if (!title && !body) return;

  add(`${title ? `<div class="t">${esc(title)}</div>` : ''}${esc(body)}`, 'msg-user');
  titleEl.value = ''; bodyEl.value = ''; bodyEl.style.height = 'auto';
  sendBtn.disabled = true; sendBtn.textContent = 'Đang chạy…';

  const pending = add(`<div class="dots"><span></span><span></span><span></span></div>
    <div style="color:var(--muted);font-size:13px;margin-top:6px">đang tìm post cũ và đọc thread…</div>`, 'card');

  try{
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({title, body}),
    });
    const data = await res.json();
    if (data.ok){
      pending.innerHTML = renderCard(data);
    } else {
      pending.className = 'card err';
      pending.innerHTML = `<div class="row"><span class="badge b-refuse">Lỗi</span></div>
        <p class="answer">${esc(data.error || 'Không rõ lỗi')}</p>
        ${data.trace ? `<details class="trace"><summary>Trace</summary><pre>${esc(JSON.stringify(data.trace, null, 2))}</pre></details>` : ''}`;
    }
  } catch (e){
    pending.className = 'card err';
    pending.innerHTML = `<p class="answer">Không gọi được server: ${esc(e.message)}</p>`;
  } finally {
    sendBtn.disabled = false; sendBtn.textContent = 'Gửi';
    bodyEl.focus(); scroll();
  }
}

sendBtn.addEventListener('click', send);
bodyEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
bodyEl.addEventListener('input', () => {
  bodyEl.style.height = 'auto';
  bodyEl.style.height = Math.min(bodyEl.scrollHeight, 180) + 'px';
});

const exBox = document.getElementById('examples');
for (const [t, b] of EXAMPLES){
  const el = document.createElement('div');
  el.className = 'ex';
  el.textContent = t || b;
  el.onclick = () => { titleEl.value = t; bodyEl.value = b; bodyEl.focus();
    bodyEl.dispatchEvent(new Event('input')); };
  exBox.appendChild(el);
}

fetch('/api/config').then(r => r.json()).then(c => {
  document.getElementById('model').textContent = c.model;
  const k = document.getElementById('key');
  k.textContent = c.api_key_present ? `${c.api_key_env} ✓` : `thiếu ${c.api_key_env}`;
  k.className = 'pill ' + (c.api_key_present ? 'ok' : 'bad');
  hintEl.textContent = c.api_key_present
    ? `Tag hợp lệ: ${c.tags.join(' · ')}`
    : 'Chưa có API key — copy codebase/.env.example thành codebase/.env, điền key rồi chạy lại server.';
}).catch(() => {});

bodyEl.focus();
</script>
</body>
</html>
